services:
  - type: web
    name: vidlink-app
    runtime: python
    buildCommand: pip install -r requirements.txt && DENO_INSTALL=/opt/render/project/.deno sh -c "curl -fsSL https://deno.land/install.sh | sh"
    startCommand: gunicorn --bind 0.0.0.0:$PORT backend.app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: DENO_PATH
        value: "/opt/render/project/.deno/bin/deno"